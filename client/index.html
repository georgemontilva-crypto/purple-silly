<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Purple Organics - Premium Silly Dots Supplements</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet" />
  </head>

  <body>
    <!-- Ambient background orbs. Translate ranges kept moderate (not the
         original wider drift) so the orb's still-visible interior never
         wanders past the viewport edge mid-gradient — closest-side sizing
         in index.css only guarantees a clean fade at the orb's OWN edge,
         it can't help if the browser's own viewport boundary clips through
         the middle of the gradient first. -->
    <div id="ambient-orbs" aria-hidden="true">
      <div class="orb orb-1" style="--ox0:-5vw; --oy0:6vh; --ox1:16vw; --oy1:32vh; left:5vw; top:5vh;"></div>
      <div class="orb orb-2" style="--ox0:32vw; --oy0:-3vh; --ox1:-11vw; --oy1:27vh; left:55vw; top:0vh;"></div>
      <div class="orb orb-3" style="--ox0:11vw; --oy0:37vh; --ox1:37vw; --oy1:6vh; left:15vw; top:65vh;"></div>
      <div class="orb orb-4" style="--ox0:38vw; --oy0:29vh; --ox1:6vw; --oy1:42vh; left:70vw; top:50vh;"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
